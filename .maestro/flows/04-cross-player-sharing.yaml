# ============================================
# Flow 04: Cross-Player Sharing
# ============================================
# Tests: Share match with another player, share code generation,
#         viewing shared items, share hub navigation
#
# Prerequisites:
#   - User is logged in
#   - At least 1 match exists (run 03-match-creation.yaml first)
#
# Note: Full cross-player sharing requires 2 accounts.
# This flow tests the sharing UI and code generation from a single account.

appId: com.ultimatepetanque.app

---

# ============================================
# Phase 1: Navigate to History
# ============================================

- launchApp:
    clearState: false

- assertVisible:
    text: ".*Accueil.*|.*Home.*"
    timeout: 10000

# Go to history to find a match to share
- scrollUntilVisible:
    element:
      text: ".*Historique.*|.*History.*|.*Voir tout.*|.*See all.*"
    direction: DOWN
    timeout: 8000

- tapOn:
    text: ".*Historique.*|.*History.*|.*Voir tout.*|.*See all.*"

- assertVisible:
    text: ".*Historique.*|.*History.*"
    timeout: 5000

# ============================================
# Phase 2: Open Match Detail
# ============================================

# Tap on the first match in the list
- tapOn:
    index: 0
    point: "50%,30%"
    optional: true

# Wait for match detail to load
- assertVisible:
    text: ".*Match.*|.*Détail.*|.*Detail.*|.*Score.*"
    timeout: 5000

# ============================================
# Phase 3: Open Share Modal
# ============================================

# Look for share button
- scrollUntilVisible:
    element:
      text: ".*Partager.*|.*Share.*"
    direction: DOWN
    timeout: 8000

- tapOn:
    text: ".*Partager.*|.*Share.*"

# Verify share modal opened
- assertVisible:
    text: ".*Partager.*|.*Share.*|.*Code.*|.*QR.*|.*Lien.*|.*Link.*"
    timeout: 5000

# ============================================
# Phase 4: Verify Share Code Generation
# ============================================

# A share code should be generated
- assertVisible:
    text: ".*[A-Z0-9]{6,}.*"
    timeout: 5000

# Copy share code button should be present
- runFlow:
    when:
      visible: ".*Copier.*|.*Copy.*"
    commands:
      - tapOn:
          text: ".*Copier.*|.*Copy.*"

# QR code should be visible
- runFlow:
    when:
      visible:
        id: "qr-code"
    commands:
      - assertVisible:
          id: "qr-code"

# Close share modal
- tapOn:
    text: ".*Fermer.*|.*Close.*|.*✕.*|.*×.*"
    optional: true

# If no close button, press back
- back

# ============================================
# Phase 5: Navigate to Share Hub
# ============================================

# Go back to home
- tapOn:
    text: ".*Accueil.*|.*Home.*"
    optional: true

# Navigate to Share Hub
- scrollUntilVisible:
    element:
      text: ".*Partage.*|.*Share.*|.*Hub.*"
    direction: DOWN
    timeout: 8000

- runFlow:
    when:
      visible: ".*Hub de partage.*|.*Share Hub.*|.*Mes partages.*|.*My shares.*"
    commands:
      - tapOn:
          text: ".*Hub de partage.*|.*Share Hub.*|.*Mes partages.*|.*My shares.*"
      - assertVisible:
          text: ".*Partag.*|.*Shar.*"
          timeout: 5000
      - back

# ============================================
# Phase 6: Navigate to Shared Items
# ============================================

# Check notifications hub for pending share requests
- runFlow:
    when:
      visible: ".*Notifications.*|.*notification.*"
    commands:
      - tapOn:
          text: ".*Notifications.*"
      - assertVisible:
          text: ".*Notification.*"
          timeout: 5000
      - back

# ============================================
# Phase 7: Navigate to Match Invitations
# ============================================

- scrollUntilVisible:
    element:
      text: ".*Invitation.*|.*invitation.*"
    direction: DOWN
    timeout: 5000
    optional: true

- runFlow:
    when:
      visible: ".*Invitation.*"
    commands:
      - tapOn:
          text: ".*Invitation.*"
      - assertVisible:
          text: ".*Invitation.*|.*Demande.*|.*Request.*"
          timeout: 5000
      - back

# Return to home
- tapOn:
    text: ".*Accueil.*|.*Home.*"
    optional: true
